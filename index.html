<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A. Mian</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ink:      #0a0806;
      --cream:    #ede7dd;
      --cream-50: rgba(237, 231, 221, 0.50);
      --cream-25: rgba(237, 231, 221, 0.25);
      --gold:     #c4a46a;
      --gold-dim: rgba(196, 164, 106, 0.55);
    }

    html {
      background: var(--ink);
      overscroll-behavior: none;
    }

    body {
      font-family: 'Cormorant Garamond', 'Palatino Linotype', Georgia, serif;
      color: var(--cream);
      overflow-x: hidden;
      overscroll-behavior: none;
    }

    /* ── Scroll space ────────────────────────────────────────── */
    #spacer { height: 320vh; }

    /* ── Video ───────────────────────────────────────────────── */
    #video-wrap {
      position: fixed;
      top: -18%;
      left: 0;
      width: 100%;
      height: 136%;
      z-index: 0;
      will-change: transform;
      opacity: 0;
      transition: opacity 1.4s ease;
    }

    #video-wrap.visible { opacity: 1; }

    #bg-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(0.80) brightness(0.95) contrast(1.05);
      pointer-events: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    /* Hide all webkit video controls */
    #bg-video::-webkit-media-controls,
    #bg-video::-webkit-media-controls-panel,
    #bg-video::-webkit-media-controls-play-button,
    #bg-video::-webkit-media-controls-start-playback-button,
    #bg-video::-webkit-media-controls-current-time-display,
    #bg-video::-webkit-media-controls-time-remaining-display,
    #bg-video::-webkit-media-controls-timeline {
      display: none !important;
      visibility: hidden !important;
      appearance: none;
    }

    /* Dark vignette overlay */
    #video-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg,
          rgba(10,8,6,0.40) 0%,
          rgba(10,8,6,0.08) 38%,
          rgba(10,8,6,0.06) 55%,
          rgba(10,8,6,0.45) 100%
        );
      z-index: 1;
    }

    /* Radial vignette */
    #video-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 90% 80% at 50% 50%,
        transparent 40%,
        rgba(10,8,6,0.30) 100%
      );
      z-index: 1;
    }

    /* ── Grain ────────────────────────────────────────────────── */
    #grain {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      overflow: hidden;
    }

    #grain-canvas {
      position: absolute;
      top: -3%;
      left: -3%;
      width: 106%;
      height: 106%;
    }

    /* ── Shared layer base ────────────────────────────────────── */
    .layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
      will-change: transform;
    }

    /* ── Coordinates — top left ───────────────────────────────── */
    #coords {
      position: absolute;
      top: clamp(2.2rem, 5vh, 4rem);
      left: clamp(1.8rem, 5vw, 4rem);
      display: flex;
      flex-direction: column;
      gap: 0.2em;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 1s ease 1.8s, transform 1s ease 1.8s;
    }

    #coords.show { opacity: 1; transform: translateY(0); }

    #coords span {
      display: block;
      font-size: clamp(0.58rem, 0.8vw, 0.72rem);
      font-weight: 300;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--cream-50);
      line-height: 1.7;
    }

    #coords .dot {
      display: inline-block;
      width: 3px;
      height: 3px;
      background: var(--gold-dim);
      border-radius: 50%;
      vertical-align: middle;
      margin-right: 0.7em;
      margin-bottom: 1px;
    }

    /* ── Elevation — top right ────────────────────────────────── */
    #elevation {
      position: absolute;
      top: clamp(1.8rem, 4.5vh, 3.5rem);
      right: clamp(1.8rem, 5vw, 4rem);
      text-align: right;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 1s ease 1.2s, transform 1s ease 1.2s;
    }

    #elevation.show { opacity: 1; transform: translateY(0); }

    #elevation .num {
      display: block;
      font-size: clamp(2.8rem, 6vw, 5.5rem);
      font-weight: 300;
      letter-spacing: 0.1em;
      line-height: 0.92;
      color: var(--cream);
    }

    #elevation .unit {
      display: block;
      font-size: clamp(0.55rem, 0.72vw, 0.68rem);
      font-weight: 300;
      letter-spacing: 0.55em;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 0.5em;
    }

    /* ── Title — bottom left ──────────────────────────────────── */
    #title-wrap {
      position: absolute;
      bottom: clamp(6rem, 18vh, 13rem);
      left: clamp(1.8rem, 5vw, 4rem);
    }

    #pre-title {
      display: block;
      font-size: clamp(0.58rem, 0.78vw, 0.7rem);
      font-weight: 300;
      letter-spacing: 0.55em;
      text-transform: uppercase;
      color: var(--cream-50);
      margin-bottom: 0.6em;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.9s ease 0.6s, transform 0.9s ease 0.6s;
    }

    #pre-title.show { opacity: 1; transform: translateY(0); }

    #title-mont {
      display: block;
      font-size: clamp(4rem, 10.5vw, 9.5rem);
      font-weight: 300;
      letter-spacing: 0.22em;
      line-height: 0.85;
      color: var(--cream);
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 1.1s ease 0.9s, transform 1.1s ease 0.9s;
    }

    #title-mont.show { opacity: 1; transform: translateY(0); }

    #title-charvin {
      display: block;
      font-size: clamp(4rem, 10.5vw, 9.5rem);
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.08em;
      line-height: 0.92;
      color: var(--cream);
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 1.1s ease 1.1s, transform 1.1s ease 1.1s;
    }

    #title-charvin.show { opacity: 1; transform: translateY(0); }

    /* ── Hairline rule ────────────────────────────────────────── */
    #rule {
      position: absolute;
      bottom: clamp(4.5rem, 13vh, 9rem);
      left: clamp(1.8rem, 5vw, 4rem);
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, var(--gold-dim), transparent 80%);
      transition: width 1.2s ease 2s;
    }

    #rule.show { width: min(38vw, 280px); }

    /* ── Location — bottom right ──────────────────────────────── */
    #location {
      position: absolute;
      bottom: clamp(4.5rem, 13vh, 9rem);
      right: clamp(1.8rem, 5vw, 4rem);
      text-align: right;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.9s ease 2.2s, transform 0.9s ease 2.2s;
    }

    #location.show { opacity: 1; transform: translateY(0); }

    #location span {
      display: block;
      font-size: clamp(0.58rem, 0.75vw, 0.7rem);
      font-weight: 300;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--cream-50);
      line-height: 1.9;
    }

    /* ── Poem — mid-scroll reveal ─────────────────────────────── */
    #poem-layer {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100vh;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      will-change: transform, opacity;
    }

    #poem {
      text-align: center;
      padding: 0 2rem;
      transform: translateY(20px);
      transition: transform 0s; /* controlled by JS */
    }

    #poem p {
      font-size: clamp(1.6rem, 3.8vw, 3.4rem);
      font-weight: 300;
      font-style: italic;
      line-height: 1.55;
      color: var(--cream);
      letter-spacing: 0.01em;
    }

    #poem-rule {
      display: block;
      width: 40px;
      height: 1px;
      background: var(--gold-dim);
      margin: 2.2em auto 1.6em;
    }

    #poem .attr {
      display: block;
      font-size: clamp(0.55rem, 0.72vw, 0.65rem);
      font-weight: 300;
      letter-spacing: 0.55em;
      text-transform: uppercase;
      color: var(--gold);
    }

    /* ── Scroll indicator — right edge ───────────────────────── */
    #scroll-ui {
      position: fixed;
      right: clamp(1rem, 2.5vw, 2rem);
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8em;
      opacity: 0;
      transition: opacity 0.8s ease 2.8s;
    }

    #scroll-ui.show { opacity: 1; }

    #scroll-ui .scroll-label {
      font-size: 0.48rem;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: rgba(237, 231, 221, 0.65);
      writing-mode: vertical-rl;
      font-weight: 300;
    }

    #scroll-track {
      width: 1px;
      height: 56px;
      background: rgba(237, 231, 221, 0.35);
      position: relative;
      overflow: visible;
    }

    #scroll-thumb {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--cream);
      margin-left: -1px;
      transition: top 0.1s linear;
    }

    /* ── Year mark — subtle bottom center ────────────────────── */
    #year-mark {
      position: fixed;
      bottom: clamp(1.2rem, 3vh, 2.5rem);
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      font-size: 0.5rem;
      letter-spacing: 0.6em;
      text-transform: uppercase;
      color: var(--cream-25);
      font-weight: 300;
      pointer-events: none;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.8s ease 3s;
    }

    #year-mark.show { opacity: 1; }

    /* ── Flow lines ──────────────────────────────────────────── */
    #lines-layer {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      will-change: opacity;
    }

    #flow-lines {
      width: 100%;
      height: 100%;
    }

    #flow-lines path {
      fill: none;
      stroke-linecap: round;
    }

    @keyframes pulse-ring {
      0%   { transform: scale(1); opacity: 0.4; }
      60%  { transform: scale(1.28); opacity: 0; }
      100% { transform: scale(1.28); opacity: 0; }
    }

    /* ── Poem block ──────────────────────────────────────────── */
    #poem-block {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 6;
      pointer-events: none;
      will-change: opacity;
    }

    #poem-col-1, #poem-col-2 {
      position: absolute;
      writing-mode: vertical-rl;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1rem, 1.6vw, 1.4rem);
      font-weight: 300;
      color: var(--cream);
      letter-spacing: 0.25em;
      line-height: 1.8;
      opacity: 0;
      vertical-align: top;
      white-space: normal;
    }

    /* まっすぐな道で — right of waves (first column, Japanese order) */
    #poem-col-1 { left: calc(50% + clamp(5rem, 8vw, 9rem)); top: 38vh; }

    /* さみしい — left of waves (second column, Japanese order) */
    #poem-col-2 { right: calc(50% + clamp(5rem, 8vw, 9rem)); top: 38vh; }

    #poem-attr {
      position: absolute;
      bottom: 12vh;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(0.52rem, 0.65vw, 0.6rem);
      font-weight: 300;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--cream-25);
      white-space: nowrap;
      opacity: 0;
    }

    /* ── Contact block ───────────────────────────────────────── */
    #contact-block {
      position: fixed;
      top: 6vh;
      right: clamp(1.8rem, 5vw, 4rem);
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1.1em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.1s ease 2s, pointer-events 0s 2s;
      white-space: nowrap;
    }

    #contact-block.active { pointer-events: all; opacity: 1; }

    .c-link {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(0.6rem, 0.85vw, 0.76rem);
      font-weight: 300;
      letter-spacing: 0.36em;
      text-transform: uppercase;
      color: rgba(237, 231, 221, 0.85);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .c-link:hover { color: var(--cream); }

    .c-row {
      display: flex;
      align-items: center;
      gap: 1.2em;
      flex-direction: row-reverse;
    }

    .c-icon-link {
      display: flex;
      align-items: center;
      gap: 0.55em;
    }

    .c-icon-link svg { opacity: 0.9; flex-shrink: 0; }
    .c-icon-link:hover svg { opacity: 1; }

    .c-sep {
      color: rgba(196, 164, 106, 0.85);
      font-size: 0.5rem;
    }
  </style>
</head>
<body>

  <!-- Scroll space -->
  <div id="spacer"></div>

  <!-- Video background -->
  <div id="video-wrap">
    <video id="bg-video" muted loop playsinline preload="metadata"
           disablepictureinpicture x-webkit-airplay="deny"
           poster="assets/charvin_poster.jpg">
      <source src="assets/charvin_loop_web.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Grain overlay -->
  <div id="grain">
    <canvas id="grain-canvas"></canvas>
  </div>

  <!-- Layer A · empty parallax depth layer -->
  <div class="layer" id="layer-a"></div>

  <!-- Layer B · Name (medium parallax) -->
  <div class="layer" id="layer-b">
    <div id="title-wrap">
      <span id="pre-title">Associate Professor</span>
      <span id="title-mont">Ammar</span>
      <span id="title-charvin">Mian</span>
    </div>
  </div>

  <!-- Layer C · Rule + University (fast parallax) -->
  <div class="layer" id="layer-c">
    <div id="rule"></div>
    <div id="location">
      <span>Université Savoie Mont Blanc</span>
    </div>
  </div>

  <!-- Contact block — appears before waves -->
  <div id="contact-block">
    <a href="mailto:ammar.mian@univ-smb.fr" class="c-link">ammar.mian@univ-smb.fr</a>
    <div class="c-row">
      <a href="https://github.com/ammarmian" target="_blank" rel="noopener" class="c-link c-icon-link">

    </div>
  </div>

  <!-- Poem block — appears after waves -->
  <div id="poem-block">
    <span id="poem-col-1">山あれば山を観る<br>雨の日は雨を聴く</span>
    <span id="poem-col-2">春夏秋冬<br>あしたもよろし<br>ゆふべもよろし</span>
    <span id="poem-attr">Santōka Taneda · 種田山頭火</span>
  </div>

  <!-- Brush strokes (late-scroll) -->
  <div id="lines-layer">
    <svg id="flow-lines" viewBox="0 0 1440 900"
         preserveAspectRatio="xMidYMid slice"
         xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Wavy paths reused at multiple stroke widths for brush quality -->
        <path id="wave-1"
          d="M 720,290
             C 808,338 632,386 720,434
             C 808,482 632,530 720,578
             C 808,610 720,622 720,622"/>
        <path id="wave-2"
          d="M 748,318
             C 828,364 668,410 748,456
             C 828,502 748,542 748,564"/>
        <path id="wave-3"
          d="M 692,336
             C 766,380 618,424 692,468
             C 766,512 692,548 692,568"/>

        <!-- Clip rects — grow top→bottom on scroll -->
        <clipPath id="clip-bs-1"><rect id="cr-1" x="0" y="0" width="1440" height="0"/></clipPath>
        <clipPath id="clip-bs-2"><rect id="cr-2" x="0" y="0" width="1440" height="0"/></clipPath>
        <clipPath id="clip-bs-3"><rect id="cr-3" x="0" y="0" width="1440" height="0"/></clipPath>
      </defs>

      <!-- Stroke 1: center, first, tallest -->
      <g clip-path="url(#clip-bs-1)" fill="none">
        <use href="#wave-1" stroke="rgba(237,231,221,0.07)" stroke-width="42"/>
        <use href="#wave-1" stroke="rgba(237,231,221,0.19)" stroke-width="16"/>
        <use href="#wave-1" stroke="rgba(237,231,221,0.65)" stroke-width="3.2"/>
      </g>

      <!-- Stroke 2: slightly right, second -->
      <g clip-path="url(#clip-bs-2)" fill="none">
        <use href="#wave-2" stroke="rgba(237,231,221,0.06)" stroke-width="34"/>
        <use href="#wave-2" stroke="rgba(237,231,221,0.16)" stroke-width="13"/>
        <use href="#wave-2" stroke="rgba(237,231,221,0.52)" stroke-width="2.6"/>
      </g>

      <!-- Stroke 3: slightly left, third -->
      <g clip-path="url(#clip-bs-3)" fill="none">
        <use href="#wave-3" stroke="rgba(237,231,221,0.05)" stroke-width="26"/>
        <use href="#wave-3" stroke="rgba(237,231,221,0.13)" stroke-width="10"/>
        <use href="#wave-3" stroke="rgba(237,231,221,0.44)" stroke-width="2.0"/>
      </g>


    </svg>
  </div>


  <!-- Scroll UI -->
  <div id="scroll-ui">
    <span class="scroll-label">scroll</span>
    <div id="scroll-track">
      <div id="scroll-thumb"></div>
    </div>
  </div>

  <script>
    /* ── Grain ──────────────────────────────────────────────── */
    const grainCanvas = document.getElementById('grain-canvas');
    const gCtx = grainCanvas.getContext('2d');
    let grainW, grainH;

    function resizeGrain() {
      grainW = grainCanvas.width  = Math.ceil(window.innerWidth  * 1.06);
      grainH = grainCanvas.height = Math.ceil(window.innerHeight * 1.06);
    }

    function drawGrain() {
      const img = gCtx.createImageData(grainW, grainH);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = (Math.random() * 255) | 0;
        d[i] = d[i + 1] = d[i + 2] = v;
        d[i + 3] = 14;
      }
      gCtx.putImageData(img, 0, 0);
    }

    resizeGrain();
    drawGrain();
    let grainInterval = setInterval(drawGrain, 85);
    window.addEventListener('resize', () => { resizeGrain(); drawGrain(); });

    /* ── Mouse parallax state ───────────────────────────────── */
    let tMX = 0, tMY = 0, mX = 0, mY = 0;
    window.addEventListener('mousemove', e => {
      tMX = (e.clientX / window.innerWidth  - 0.5) * 2;
      tMY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    /* ── Video scrubbing ────────────────────────────────────── */
    const bgVideo = document.getElementById('bg-video');
    let vidDur = 0;

    // Disable all controls on mobile and desktop
    bgVideo.removeAttribute('controls');
    bgVideo.style.pointerEvents = 'none';

    bgVideo.addEventListener('loadedmetadata', () => {
      vidDur = bgVideo.duration;
      bgVideo.pause();
    });

    // Prevent native UI and touch interactions
    bgVideo.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('touchstart', (e) => {
      if (e.target === bgVideo) e.preventDefault();
    }, { passive: false });

    /* ── Brush strokes setup ────────────────────────────────── */
    const linesLayer    = document.getElementById('lines-layer');
    const poemBlock     = document.getElementById('poem-block');
    const poemCol1      = document.getElementById('poem-col-1');
    const poemCol2      = document.getElementById('poem-col-2');
    const poemAttr      = document.getElementById('poem-attr');
    const contactBlock  = document.getElementById('contact-block');
    const brushStrokes = [
      { rect: document.getElementById('cr-1'), start: 0.67, end: 0.85 },
      { rect: document.getElementById('cr-2'), start: 0.77, end: 0.94 },
      { rect: document.getElementById('cr-3'), start: 0.82, end: 0.98 },
    ];

    /* ── Element references ─────────────────────────────────── */
    const videoWrap  = document.getElementById('video-wrap');
    const layerA     = document.getElementById('layer-a');
    const layerB     = document.getElementById('layer-b');
    const layerC     = document.getElementById('layer-c');
    const scrollThumb = document.getElementById('scroll-thumb');
    const scrollTrack = document.getElementById('scroll-track');
    const scrollUi   = document.getElementById('scroll-ui');

    /* ── Entrance sequence ──────────────────────────────────── */
    function showEl(id, cls = 'show') {
      const el = document.getElementById(id);
      if (el) el.classList.add(cls);
    }

    // Video reveal first
    requestAnimationFrame(() => {
      videoWrap.classList.add('visible');
      setTimeout(() => {
        showEl('pre-title');
        showEl('title-mont');
        showEl('title-charvin');
        showEl('rule');
        showEl('location');
        scrollUi.classList.add('show');
      }, 200);
      // Socials fade in after name appears
      setTimeout(() => {
        contactBlock.classList.add('active');
      }, 1200);
    });

    /* ── Parallax ───────────────────────────────────────────── */
    let targetY  = 0;
    let currentY = 0;

    function lerp(a, b, t) { return a + (b - a) * t; }

    function smoothstep(e0, e1, x) {
      const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
      return t * t * (3 - 2 * t);
    }

    function onScroll() {
      targetY = Math.max(0, Math.min(window.scrollY, TOTAL_H()));
    }
    window.addEventListener('scroll', onScroll, { passive: true });

    const TOTAL_H = () => document.documentElement.scrollHeight - window.innerHeight;

    function raf() {
      currentY = lerp(currentY, targetY, 0.085);
      mX = lerp(mX, tMX, 0.055);
      mY = lerp(mY, tMY, 0.055);

      const s        = currentY;
      const total    = TOTAL_H();
      const progress = total > 0 ? s / total : 0;

      // Video: scroll parallax + subtle mouse tilt
      videoWrap.style.transform =
        `translateY(${-s * 0.07 + mY * 4}px) translateX(${mX * 3}px)`;

      // Layer A: slow scroll + gentle mouse offset
      layerA.style.transform =
        `translateY(${-s * 0.20 + mY * 7}px) translateX(${mX * 5}px)`;

      // Layer B: medium scroll + more mouse depth
      layerB.style.transform =
        `translateY(${-s * 0.38 + mY * 12}px) translateX(${mX * 9}px)`;

      // Layer C: fast scroll + strongest mouse response
      layerC.style.transform =
        `translateY(${-s * 0.60 + mY * 18}px) translateX(${mX * 14}px)`;

      // Video scrubbing
      if (vidDur > 0) {
        const seek = progress * vidDur;
        if (Math.abs(bgVideo.currentTime - seek) > 0.08) bgVideo.currentTime = seek;
      }

      // Brush strokes: reveal top-to-bottom via clipRect
      const linesOpacity = smoothstep(0.44, 0.60, progress);
      linesLayer.style.opacity = linesOpacity;

      brushStrokes.forEach(bs => {
        const t = smoothstep(bs.start, bs.end, progress);
        bs.rect.setAttribute('height', t * 900);
      });


      // Poem: columns appear one after the other after waves complete
      const col1Op = smoothstep(0.88, 0.94, progress);
      const col2Op = smoothstep(0.94, 1.00, progress);
      poemBlock.style.opacity = 1;
      poemCol1.style.opacity = col1Op;
      poemCol2.style.opacity = col2Op;
      poemAttr.style.opacity = col2Op;

      // Scroll thumb
      scrollThumb.style.top = `${progress * (scrollTrack.offsetHeight - 3)}px`;

      requestAnimationFrame(raf);
    }

    requestAnimationFrame(raf);
  </script>
</body>
</html>
