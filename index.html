<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Mono&display=swap" rel="stylesheet">
   <style>
        body {
            font-family: 'Fira Mono', monospace;
            background-color: #121212;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }
        .loading-bar {
            width: 100%;
            max-width: 300px;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }
        .loading-bar::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            background: white;
            animation: load 5s linear forwards;
        }
        @keyframes load {
            from { width: 0%; }
            to { width: 100%; }
        }
        @media (max-width: 600px) {
            body {
                padding: 40px;
            }
        }
    </style>
  <script>
    setTimeout(() => {
      window.location.href = "https://ammarmian.vercel.app";
    }, 5000);
  </script>
</head>
<body>
  <h1>Page moved to https://ammarmian.vercel.app, redirecting...</h1>
  <div class="loading-bar"></div>
</body>
</html>
